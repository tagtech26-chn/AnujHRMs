name: Web Build

on:
  push:
    branches: [ main ]
    paths:
      - "src/Attendance.Web/**"
      - ".github/workflows/web-build.yml"
  pull_request:
    paths:
      - "src/Attendance.Web/**"
      - ".github/workflows/web-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Attendance.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Attendance.Web/package-lock.json
      - run: npm install
      - run: npm run build
